<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bakobtify</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Cpath d='M12 22V10l11-2v12' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='22' r='2.6' fill='%23fff'/%3E%3Ccircle cx='21' cy='20' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/player.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6v12L9 12l9-6Z" fill="currentColor" stroke="none"/><rect x="5" y="6" width="2.4" height="12" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6v12l9-6-9-6Z" fill="currentColor" stroke="none"/><rect x="16.6" y="6" width="2.4" height="12" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5l10 10H20"/><path d="M3 17h3.5l10-10H20"/><path d="m17 4 3 3-3 3"/><path d="m17 14 3 3-3 3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a5 5 0 0 0-5 5"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a5 5 0 0 0 5-5"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a5 5 0 0 0-5 5"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a5 5 0 0 0 5-5"/><path d="M11 10.5 12.5 9.5V15"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18.5" cy="17" r="2.2" fill="currentColor" stroke="none"/><path d="M20.7 17V9l-4 1"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="M19 5 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 9v6M11 6v12M15 9v6M19 11v2"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-wave"/></svg></span>
      <span class="brand-name">Bakobtify</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="search">
        <svg><use href="#i-search"/></svg><span>Buscar</span>
      </button>
      <button class="nav-item" data-view="favorites">
        <svg><use href="#i-heart"/></svg><span>Favoritas</span>
        <span class="nav-count" id="fav-count" hidden>0</span>
      </button>
      <button class="nav-item" data-view="history">
        <svg><use href="#i-history"/></svg><span>Histórico</span>
      </button>
    </nav>

    <div class="playlists">
      <div class="playlists-head">
        <span>Playlists</span>
        <button class="icon-btn xs" id="new-playlist" title="Nova playlist" aria-label="Nova playlist">
          <svg><use href="#i-plus"/></svg>
        </button>
      </div>
      <ul class="playlist-list" id="playlist-list"></ul>
    </div>

    <div class="sidebar-foot">
      <button class="status-pill" id="status-pill" title="Status da conexão com o SoundCloud">
        <span class="dot"></span><span id="status-label">verificando</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <svg class="search-ico"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Buscar faixas no SoundCloud" autocomplete="off" spellcheck="false" aria-label="Buscar faixas">
        <kbd>/</kbd>
      </div>
      <button class="icon-btn" id="queue-toggle" title="Fila de reprodução" aria-label="Fila de reprodução">
        <svg><use href="#i-queue"/></svg>
      </button>
    </header>
    <div class="view" id="view"></div>
  </main>

  <aside class="queue-panel" id="queue-panel" hidden>
    <header class="queue-head">
      <span>Fila</span>
      <button class="icon-btn xs" id="queue-close" aria-label="Fechar fila"><svg><use href="#i-x"/></svg></button>
    </header>
    <ul class="queue-list" id="queue-list"></ul>
  </aside>

  <footer class="player">
    <div class="now">
      <div class="now-art" id="now-art"><svg><use href="#i-note"/></svg></div>
      <div class="now-meta">
        <div class="now-title" id="now-title">Nada tocando</div>
        <div class="now-artist" id="now-artist">Busque algo para começar</div>
      </div>
      <span class="source-badge" id="source-badge" hidden title="Áudio servido pelo embed do SoundCloud">embed</span>
      <button class="icon-btn sm" id="now-fav" aria-label="Favoritar faixa atual" disabled>
        <svg><use href="#i-heart"/></svg>
      </button>
    </div>

    <div class="controls">
      <div class="control-buttons">
        <button class="icon-btn sm" id="btn-shuffle" title="Aleatório" aria-label="Aleatório"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn sm" id="btn-prev" title="Anterior" aria-label="Anterior"><svg><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="btn-play" title="Tocar" aria-label="Tocar" disabled>
          <svg class="ico-play"><use href="#i-play"/></svg>
          <svg class="ico-pause"><use href="#i-pause"/></svg>
        </button>
        <button class="icon-btn sm" id="btn-next" title="Próxima" aria-label="Próxima"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn sm" id="btn-repeat" title="Repetir" aria-label="Repetir"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek">
        <span class="time" id="time-current">0:00</span>
        <div class="bar" id="seek-bar" role="slider" tabindex="0" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-buffer" id="seek-buffer"></div>
          <div class="bar-fill" id="seek-fill"></div>
          <div class="bar-knob" id="seek-knob"></div>
        </div>
        <span class="time" id="time-total">0:00</span>
      </div>
    </div>

    <div class="extra">
      <button class="icon-btn sm" id="btn-mute" aria-label="Silenciar"><svg><use href="#i-volume"/></svg></button>
      <div class="bar volume-bar" id="vol-bar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="bar-fill" id="vol-fill"></div>
        <div class="bar-knob" id="vol-knob"></div>
      </div>
    </div>
  </footer>

  <div class="widget-dock" id="widget-dock" hidden></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="dialog" id="dialog">
  <form method="dialog" id="dialog-form">
    <h2 id="dialog-title">Nova playlist</h2>
    <p id="dialog-desc" class="dialog-desc">Dê um nome para a playlist.</p>
    <input type="text" id="dialog-input" maxlength="60" placeholder="Nome da playlist" autocomplete="off">
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost" type="button" id="dialog-cancel">Cancelar</button>
      <button value="ok" class="btn primary" type="submit" id="dialog-ok">Criar</button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
